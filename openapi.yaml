            limit: { type: integer }
            totalPages: { type: integer }

    # ─── Watchlists ────────────────────────────────────────────
    Watchlist:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        items: { type: array, items: { type: object } }

    # ─── Copilot ───────────────────────────────────────────────
    ConversationsResponse:
      type: object
      properties:
        data: { type: array, items: { type: object } }
        meta:
          type: object
          properties:
            total: { type: integer }
            page: { type: integer }
            limit: { type: integer }
            totalPages: { type: integer }
    ChatbotModels:
      type: object
      properties:
        models:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              capabilities:
                type: object
                properties:
                  imageInput: { type: boolean }
                  pdfInput: { type: boolean }
        default: { type: string }
        availableCapabilities: { type: array, items: { type: string } }

    # ─── Misc ──────────────────────────────────────────────────
    ExchangeRates:
      type: object
      properties:
        result: { type: string }
        base_code: { type: string }
        conversion_rates: { type: object, additionalProperties: true }
        time_last_update_unix: { type: integer }
    SnapTradeStatus:
      type: object
      properties:
        isRegistered: { type: boolean }
        connectionsCount: { type: integer }

    # ── Admin: Jobs (N — stooq zip import) ──────────────────────────────────

    StooqDataset:
      type: string
      description: Identifies a stooq bulk-download dataset (region + timeframe)
      enum:
        - daily_world
        - daily_us
        - daily_uk
        - daily_jp
        - daily_hk
        - daily_pl
        - daily_hu
        - daily_macro

    StooqImportUploadResponse:
      type: object
      required: [uploadId, dataset, sizeBytes]
      properties:
        uploadId:
          type: string
          format: uuid
        dataset:
          $ref: '#/components/schemas/StooqDataset'
        sizeBytes:
          type: integer
          description: Size of the uploaded file in bytes

    StooqImportRunRequest:
      type: object
      required: [dataset, uploadId]
      properties:
        dataset:
          $ref: '#/components/schemas/StooqDataset'
        uploadId:
          type: string
          format: uuid

    StooqImportRunResponse:
      type: object
      required: [jobName, namespace, status]
      properties:
        jobName:
          type: string
          description: Kubernetes Job name, e.g. stooq-importer-daily-us
        namespace:
          type: string
        status:
          type: string
          enum: [Running, Succeeded, Failed, NotFound]

    StooqImportStatusResponse:
      type: object
      required: [dataset, jobName, status]
      properties:
        dataset:
          $ref: '#/components/schemas/StooqDataset'
        jobName:
          type: string
        status:
          type: string
          enum: [Running, Succeeded, Failed, NotFound]
        details:
          type: object
          properties:
            active:    { type: integer }
            succeeded: { type: integer }
            failed:    { type: integer }

    StooqImportLogEntry:
      type: object
      required: [dataset]
      description: >
        Per-dataset import history sourced from admin.job_run.
        importedAt reflects started_at (job trigger time) until the post-import
        hook writes a confirmed value. latestDate and rowsDeleted are null until
        the post-import hook is wired (open item D53).
      properties:
        dataset:
          $ref: '#/components/schemas/StooqDataset'
        latestDate:
          type: string
          format: date
          nullable: true
          description: MAX(date) confirmed from stooq foreign table after import (written by post-import hook)
        importedAt:
          type: string
          format: date-time
          nullable: true
          description: When the import job was started (started_at); updated to hook-call time once post-import hook is wired
        rowsDeleted:
          type: integer
          nullable: true
          description: Overflow rows cleaned up in the last run (written by post-import hook)

    AdminUser:
      type: object
      required: [id, groups, lastLogin, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: User's stable id (PocketID subject / portfoliost user id)
        email: { type: string, format: email, nullable: true }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        groups:
          type: array
          items: { type: string }
          description: Group memberships for authorization
        lastLogin:
          type: string
          format: date-time
          nullable: true
          description: Last successful authentication (null if never logged in)
        createdAt:
          type: string
          format: date-time

    AdminUserListResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminUser' }
        pagination:
          type: object
          required: [total, page, per_page, total_pages]
          properties:
            total: { type: integer }
            page: { type: integer }
            per_page: { type: integer }
            total_pages: { type: integer }

