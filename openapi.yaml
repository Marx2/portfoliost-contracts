  # ── Admin: Jobs (N — stooq zip import) ──────────────────────────────────────

  /admin/jobs/stooq-import/upload:
    post:
      tags: [Admin]
      summary: Upload a stooq zip file for import
      description: |
        Streams a stooq bulk-download zip to the shared upload volume.
        Returns an uploadId used to trigger the import job.
        Maximum file size: 1 GB.
      operationId: uploadStooqZip
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [dataset, file]
              properties:
                dataset:
                  $ref: '#/components/schemas/StooqDataset'
                file:
                  type: string
                  format: binary
                  description: The stooq zip archive to import
      responses:
        '200':
          description: Upload accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StooqImportUploadResponse' }
        '400':
          description: Invalid dataset or file type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: File exceeds 1 GB limit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/jobs/stooq-import/run:
    post:
      tags: [Admin]
      summary: Trigger a stooq import Kubernetes Job
      description: |
        Creates a Kubernetes Job (via jobshot) that runs pgloader against the
        previously uploaded zip file. The job is named stooq-importer-<dataset>.
      operationId: runStooqImport
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StooqImportRunRequest' }
      responses:
        '200':
          description: Job started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StooqImportRunResponse' }
        '404':
          description: Upload not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Import job already running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/jobs/stooq-import/status:
    get:
      tags: [Admin]
      summary: Get current status of a stooq import job
      operationId: getStooqImportStatus
      security: [{ bearerAuth: [] }]
      parameters:
        - name: dataset
          in: query
          required: true
          schema: { $ref: '#/components/schemas/StooqDataset' }
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StooqImportStatusResponse' }

  /admin/jobs/stooq-import/log:
    get:
      tags: [Admin]
      summary: Get last import log for all stooq datasets
      description: >
        Returns one entry per StooqDataset sourced from admin.job_run.
        No cross-module call — importedAt = started_at until the post-import hook
        (open item D53) writes confirmed latestDate/rowsDeleted values.
      operationId: getStooqImportLog
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: One entry per dataset
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StooqImportLogEntry' }

  /admin/users:
    get:
      tags: [Admin]
      summary: List users with identity and access metadata
      description: |
        Returns users with access metadata (groups, last login) merged with
        identity (email, name) resolved from the identity provider.
      operationId: listAdminUsers
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          required: false
          schema: { type: integer, default: 50, maximum: 200 }
        - name: search
          in: query
          required: false
          schema: { type: string, description: Prefix-match on user id shape }
      responses:
        '200':
          description: Paginated admin user list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserListResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Not a portfoliost_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
