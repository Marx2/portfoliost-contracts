openapi: 3.0.3
info:
  title: Portfoliost API
  version: 1.0.0
  description: |
    Portfoliost API contract — shared between frontend and backend.
    Based on the Stoxly API with portfoliost-specific deviations.

servers:
  - url: http://localhost:8080/api
    description: Via KrakenD (Docker Compose)
  - url: http://localhost:3000/api
    description: Direct backend (development)

tags:
  - name: Auth
    description: Custom mock authentication (replaces Supabase)
  - name: Users
  - name: Billing
  - name: Notifications
  - name: News
  - name: Instruments
  - name: Charting
  - name: Portfolios
  - name: Wallets
  - name: Watchlists
  - name: Copilot
  - name: Misc
  - name: Admin
    description: Admin panel APIs (requires portfoliost_admin group)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    symbol:
      name: symbol
      in: path
      required: true
      schema: { type: string }
      description: Instrument symbol, e.g. AAPL or AAPL.US
    portfolioId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    walletId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    watchlistId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    positionId:
      name: positionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    eventId:
      name: eventId
      in: path
      required: true
      schema: { type: string }
    cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque cursor for keyset pagination
    limit:
      name: limit
      in: query
      schema: { type: integer, default: 10 }
    page:
      name: page
      in: query
      schema: { type: integer, default: 1 }
    perPage:
      name: perPage
      in: query
      schema: { type: integer, default: 10 }
    timeframe:
      name: timeframe
      in: query
      schema:
        type: string
        enum: [1D, 5D, 1M, 3M, 6M, YTD, 1Y, 2Y, 3Y, 5Y, ALL]
        default: 1Y
    benchmark:
      name: benchmark
      in: query
      schema: { type: string }
      description: Benchmark symbol to overlay (e.g. SPY)

  schemas:
    # ─── Shared ────────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
        statusCode: { type: integer }
    Pagination:
      type: object
      properties:
        count: { type: integer }
        total_count: { type: integer }
        has_next_page: { type: boolean }
        has_previous_page: { type: boolean }
        next_cursor: { type: string, nullable: true }
        previous_cursor: { type: string, nullable: true }
    PageResponse:
      type: object
      properties:
        items: { type: array, items: { type: object } }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        totalPages: { type: integer }
        hasNext: { type: boolean }
        hasPrevious: { type: boolean }

    # ─── Auth ──────────────────────────────────────────────────
    LoginPayload:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    AuthResponse:
      type: object
      required: [access_token, token_type, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, default: bearer }
        expires_in: { type: integer }
        user:
          $ref: '#/components/schemas/AuthUser'
    AuthUser:
      type: object
      required: [id, email, language, role, isDemoUser, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        language: { type: string }
        role: { type: string }
        groups:
          type: array
          items: { type: string }
          description: User's group memberships for authorization
        avatarUrl: { type: string, format: uri, nullable: true, description: "URL to user's avatar image from identity provider" }
        isDemoUser: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time, nullable: true }
    MeResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'

    # ─── Users ─────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [id, email, groups, language, createdAt, updatedAt, isDemoUser]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        avatarUrl: { type: string, format: uri, nullable: true, description: "URL to user's avatar image from identity provider" }
        groups:
          type: array
          items: { type: string }
        language: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        isDemoUser: { type: boolean }
        recentSearches:
          type: array
          maxItems: 10
          items: { type: string }
          description: "User's last 10 searched stock symbols, most recent first"
    UpdateProfileRequest:
      type: object
      properties:
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        language: { type: string }
        recentSearches:
          type: array
          maxItems: 10
          items: { type: string }
          description: "User's last 10 searched stock symbols, most recent first"
    UserPreferences:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        uiPreferences: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CustomBenchmarksResponse:
      type: object
      properties:
        items: { type: array, items: { type: object, additionalProperties: true } }
    CustomTimeframesResponse:
      type: object
      properties:
        items: { type: array, items: { type: object, additionalProperties: true } }
    OnboardingStatus:
      type: object
      properties:
        completed: { type: boolean }
        currentStep: { type: string, nullable: true }
    OnboardingDraft:
      type: object
      properties:
        draft: { nullable: true }

    # ─── Billing ───────────────────────────────────────────────
    BillingPlans:
      type: object
      properties:
        plans:
          type: array
          items:
            type: object
            properties:
              tier: { type: string }
              name: { type: string }
              prices:
                type: array
                items:
                  type: object
                  properties:
                    priceId: { type: string }
                    interval: { type: string }
                    amount: { type: integer }
                    currency: { type: string }
              features: { type: array, items: { type: string } }
    BillingSubscription:
      type: object
      properties:
        planTier: { type: string }
        status: { type: string }
        billingInterval: { type: string, nullable: true }
        currentPeriodStart: { type: string, nullable: true }
        currentPeriodEnd: { type: string, nullable: true }
        trialStart: { type: string, nullable: true }
        trialEnd: { type: string, nullable: true }
        cancelAtPeriodEnd: { type: boolean }
        cancelAt: { type: string, nullable: true }
        isTrialing: { type: boolean }
    BillingEntitlements:
      type: object
      properties:
        tier: { type: string }
        isTrialing: { type: boolean }
        features:
          type: object
          additionalProperties:
            type: object
            properties:
              enabled: { type: boolean }
              limit: { nullable: true }
              delayMinutes: { type: integer }

    # ─── Notifications ─────────────────────────────────────────
    NotificationsList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        nextCursor: { type: string, nullable: true }
        unreadCount: { type: integer }
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        message: { type: string }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: true }
    NotificationPreferences:
      type: object
      properties:
        newsEnabled: { type: boolean }
        newsMinActionability: { type: string, nullable: true }
        newsMaterialOnly: { type: boolean }
        earningsEnabled: { type: boolean }
        insiderEnabled: { type: boolean }
        insiderMinValueUsd: { type: number, nullable: true }
        analystEnabled: { type: boolean }
        analystDirection: { type: string, nullable: true }
        channelsWeb: { type: boolean }
        channelsPush: { type: boolean }
        channelsEmail: { type: boolean }
    NotificationSymbols:
      type: object
      properties:
        items: { type: array, items: { type: object } }
        totalEnabled: { type: integer }
        totalMuted: { type: integer }
    UnreadCount:
      type: object
      properties:
        count: { type: integer }
    # ─── News ──────────────────────────────────────────────────
    NewsArticleList:
      type: object
      properties:
        data: { type: array, items: { type: object, additionalProperties: true } }
        pagination:
          $ref: '#/components/schemas/Pagination'
    NewsTimeline:
      type: object
      properties:
        data: { type: array, items: { type: object, additionalProperties: true } }
        pagination:
          $ref: '#/components/schemas/Pagination'
    MarketContexts:
      type: object
      properties:
        error: { nullable: true }
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              scope: { type: string }
              type: { type: string }
              summary: { type: string }
    NewsStats:
      type: object
      properties:
        error: { nullable: true }
        data:
          type: object
          additionalProperties: true
    TrackedTickers:
      type: object
      properties:
        data:
          type: object
          properties:
            tickers:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  symbol: { type: string }
                  createdAt: { type: string, format: date-time }
                  totalArticleCount: { type: integer }
                  totalAnalyzedArticleCount: { type: integer }
                  lastFetchedAt: { type: string, format: date-time }
                  isActive: { type: boolean }
                  isDefault: { type: boolean }
    LiveStreamChannel:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        handle: { type: string }
        fallbackVideoId: { type: string, nullable: true }
        hlsUrl: { type: string, nullable: true }
        region: { type: string, nullable: true }
        category: { type: string, nullable: true }
    LiveStream:
      type: object
      properties:
        videoId: { type: string, nullable: true }
        isLive: { type: boolean }
        hlsUrl: { type: string, nullable: true }
    NewsInsights:
      type: object
      properties:
        data:
          type: array
          items: { type: object, additionalProperties: true }

    # ─── Instruments ───────────────────────────────────────────
    InstrumentDetail:
      type: object
      properties:
        id: { type: string }
        symbol: { type: string }
        name: { type: string }
        exchange: { type: string }
        type: { type: string }
        currency: { type: string }
    InstrumentProfile:
      type: object
      properties:
        ticker: { type: string }
        name: { type: string }
        country: { type: string, nullable: true }
        countryCode: { type: string, nullable: true }
        isin: { type: string, nullable: true }
        currency: { type: string }
        exchange: { type: string }
        finnhubIndustry: { type: string, nullable: true }
        ipo: { type: string, nullable: true }
        logo: { type: string, nullable: true }
        marketCapitalization: { type: number, nullable: true }
        marketCapCurrency: { type: string, nullable: true }
        marketcapUSD: { type: number, nullable: true }
        phone: { type: string, nullable: true }
        shareOutstanding: { type: number, nullable: true }
        weburl: { type: string, nullable: true }
        description: { type: string, nullable: true }
        gicsSector: { type: string, nullable: true }
        gicsIndustryGroup: { type: string, nullable: true }
        gicsIndustry: { type: string, nullable: true }
        gicsSubIndustry: { type: string, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true }
        employeeTotal: { type: number, nullable: true }
        ceo: { type: string, nullable: true }
    InstrumentMetrics:
      type: object
      properties:
        metrics:
          type: object
          properties:
            symbol: { type: string }
            metricType: { type: string }
            metric: { type: object, additionalProperties: true }
        priceTarget:
          type: object
          properties:
            symbol: { type: string }
            targetHigh: { type: number }
            targetLow: { type: number }
            targetMean: { type: number }
            targetMedian: { type: number }
            numberAnalysts: { type: integer }
            lastUpdated: { type: string }
        trailingValuation:
          type: object
          properties:
            marketCap: { type: number }
            enterpriseValue: { type: number }
            peRatio: { type: number }
            psRatio: { type: number }
            pbRatio: { type: number }
            evToSales: { type: number }
            evToEBITDA: { type: number }
            dividendYield: { type: number }
            dividendPerShare: { type: number }
            payoutRatio: { type: number }
            pegRatio: { type: number }
            priceTarget: { type: number }
            dpsGrowth5yr: { type: number }
            priceToFcf: { type: number }
            evToGrossProfit: { type: number }
        margins:
          type: object
          properties:
            grossMargin: { type: number }
            operatingMargin: { type: number }
            ebitdaMargin: { type: number }
            netProfitMargin: { type: number }
        capitalEfficiency:
          type: object
          properties:
            returnOnAssets: { type: number }
            returnOnTotalAssets: { type: number }
            returnOnEquity: { type: number }
            assetTurnover: { type: number }
            inventoryTurnover: { type: number }
        financialHealth:
          type: object
          properties:
            currentRatio: { type: number }
            quickRatio: { type: number }
        perShare:
          type: object
          properties:
            revenuePerShare: { type: number }
            eps: { type: number }
            bookValuePerShare: { type: number }
            tangibleBookValuePerShare: { type: number }
            cashPerShare: { type: number }
            operatingCashFlowPerShare: { type: number }
    InstrumentOverviewMetrics:
      type: object
      properties:
        symbol: { type: string }
        marketCap: { type: number }
        enterpriseValue: { type: number }
        sharesOutstanding: { type: number }
        revenue: { type: number }
        employees: { type: number, nullable: true }
        cash: { type: number }
        netDebt: { type: number }
        revenueGrowth3yr: { type: number }
        revenueGrowth5yr: { type: number }
        revenueGrowth10yr: { type: number }
        epsGrowth3yr: { type: number }
        epsGrowth5yr: { type: number }
        epsGrowth10yr: { type: number }
        revenueGrowthFwd: { type: number }
        epsGrowthFwd: { type: number }
    Quote:
      type: object
      required: [symbol, currentPrice, highPrice, lowPrice, openPrice, previousClose, change, percentChange, timestamp, marketSession, timezone, bid, ask, bidSize, askSize, currency, regularMarketPrice, extendedHoursChange, extendedHoursChangePercent, marketSessionPhase, source, asOf]
      properties:
        symbol: { type: string }
        currentPrice: { type: number }
        highPrice: { type: number }
        lowPrice: { type: number }
        openPrice: { type: number }
        previousClose: { type: number }
        change: { type: number }
        percentChange: { type: number }
        timestamp: { type: integer }
        marketSession: { type: string }
        timezone: { type: string }
        bid: { type: number }
        ask: { type: number }
        bidSize: { type: integer }
        askSize: { type: integer }
        currency: { type: string }
        regularMarketPrice: { type: number }
        extendedHoursChange: { type: number }
        extendedHoursChangePercent: { type: number }
        marketSessionPhase: { type: string }
        source: { type: string }
        asOf: { type: integer }
    PriceHistory:
      type: object
      required: [symbol, closePrices, highPrices, lowPrices, openPrices, volumes, timestamps, status, currency]
      properties:
        symbol: { type: string }
        closePrices: { type: array, items: { type: number } }
        highPrices: { type: array, items: { type: number } }
        lowPrices: { type: array, items: { type: number } }
        openPrices: { type: array, items: { type: number } }
        volumes: { type: array, items: { type: number } }
        timestamps: { type: array, items: { type: integer } }
        status: { type: string }
        currency: { type: string }
    SearchResult:
      type: object
      properties:
        symbol: { type: string }
        name: { type: string }
        type: { type: string }
        exchange: { type: string }
        source: { type: string }
    InstrumentSearchResponse:
      type: object
      properties:
        count: { type: integer }
        results: { type: array, items: { $ref: '#/components/schemas/SearchResult' } }
    FundamentalsData:
      type: object
      required: [financialHighlights]
      properties:
        financialHighlights:
          type: object
          properties:
            incomeStatement:
              type: array
              items:
                type: object
                properties:
                  year: { type: integer }
                  revenue: { type: number }
                  ebit: { type: number }
                  netIncome: { type: number }
                  netIncomeGrowth: { type: number, nullable: true }
                  netIncomeMargin: { type: number }
                  earningsPerShare: { type: number }
                  earningsPerShareGrowth: { type: number, nullable: true }
                  dilutedSharesOutstanding: { type: number }
                  ebitda: { type: number }
            balanceSheet:
              type: array
              items:
                type: object
                properties:
                  year: { type: integer }
                  totalAssets: { type: number }
                  totalLiabilities: { type: number }
                  shareholdersEquity: { type: number }
                  cash: { type: number }
                  cashAndShortTermInvestments: { type: number }
                  totalDebt: { type: number }
                  netDebt: { type: number }
                  workingCapital: { type: number }
                  totalCapitalization: { type: number }
                  retainedEarnings: { type: number }
                  debtEquityRatio: { type: number }
                  longTermDebtToCapitalization: { type: number }
                  totalDebtToCapitalization: { type: number }
            cashFlow:
              type: array
              items:
                type: object
                properties:
                  year: { type: integer }
                  cashFlowFromOperatingActivities: { type: number }
                  cashFlowFromFinancingActivities: { type: number }
                  cashFlowFromInvestingActivities: { type: number }
                  freeCashFlow: { type: number }
                  freeCashFlowGrowth: { type: number, nullable: true }
                  cashFlowFromOperatingActivitiesGrowth: { type: number, nullable: true }
                  freeCashFlowPerShare: { type: number }
                  capitalExpenditures: { type: number }
                  depreciation: { type: number }
                  dividendPayment: { type: number }
    OwnershipData:
      type: object
      properties:
        institutional:
          type: array
          items: { $ref: '#/components/schemas/HoldingGroup' }
        mutualFund:
          type: array
          items: { $ref: '#/components/schemas/HoldingGroup' }
        insider:
          type: array
          items: { $ref: '#/components/schemas/HoldingGroup' }
        insiderTransactions:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              transactionDate: { type: string }
              transactionCode: { type: string }
              transactionText: { type: string }
              transactionAmount: { type: number }
              transactionValue: { type: number }
              filingDate: { type: string }
    HoldingGroup:
      type: object
      required: [date, holdingPercentage, holdersCount, sumOfCurrentPositions, sumOfCurrentPositionsValue]
      properties:
        date: { type: string }
        holdingPercentage: { type: number }
        holdersCount: { type: integer }
        sumOfCurrentPositions: { type: number }
        sumOfCurrentPositionsValue: { type: number }
    DividendsData:
      type: object
      properties:
        history:
          type: array
          items:
            type: object
            required: [date, year, amount, currency, type]
            properties:
              date: { type: string }
              year: { type: integer }
              amount: { type: number }
              currency: { type: string }
              type: { type: string }
    CalendarData:
      type: object
      properties:
        currency: { type: string }
        earnings:
          type: array
          items:
            type: object
            required: [date]
            properties:
              date: { type: string }
              title: { type: string }
              year: { type: integer }
              quarter: { type: integer }
        exDividend:
          type: array
          items:
            type: object
            required: [date]
            properties:
              date: { type: string }
              title: { type: string }
              year: { type: integer }
              amount: { type: number }
        dividend:
          type: array
          items:
            type: object
            required: [date]
            properties:
              date: { type: string }
              title: { type: string }
              year: { type: integer }
              amount: { type: number }
        upcoming:
          type: array
          items:
            type: object
            required: [date, type]
            properties:
              symbol: { type: string }
              companyName: { type: string }
              type: { type: string }
              date: { type: string }
              title: { type: string }
              amount: { type: number, nullable: true }
              quarter: { type: integer, nullable: true }
        past:
          type: array
          items:
            type: object
            required: [date, type]
            properties:
              symbol: { type: string }
              companyName: { type: string }
              type: { type: string }
              date: { type: string }
              title: { type: string }
              amount: { type: number, nullable: true }
              quarter: { type: integer, nullable: true }
    SeasonalityData:
      type: object
      properties:
        symbol: { type: string }
        years: { type: integer }
        metric: { type: string }
        monthly_returns:
          type: array
          items:
            type: object
            required: [month, return_pct]
            properties:
              month: { type: string }
              return_pct: { type: number, nullable: true }
    EPSSurprises:
      type: object
      properties:
        annual:
          type: array
          items: { $ref: '#/components/schemas/EPSRow' }
        quarterly:
          type: array
          items: { $ref: '#/components/schemas/EPSRow' }
    EPSRow:
      type: object
      properties:
        date: { type: string }
        year: { type: integer }
        quarter: { type: integer }
        eps: { type: number }
        epsEstimate: { type: number }
        epsDifference: { type: number }
        revenue: { type: number }
        revenueEstimate: { type: number }
        revenueDifference: { type: number }
        surprise: { type: number }
        surprisePercent: { type: number }
        time: { type: string }
    ProjectionsData:
      type: object
      properties:
        currency: { type: string }
        priceTarget:
          type: object
          properties:
            lastUpdated: { type: string }
            low: { type: number, nullable: true }
            mean: { type: number, nullable: true }
            current: { type: number, nullable: true }
            high: { type: number, nullable: true }
        recommendation:
          type: object
          properties:
            period: { type: string }
            strongBuy: { type: integer }
            buy: { type: integer }
            hold: { type: integer }
            sell: { type: integer }
            strongSell: { type: integer }
        earnings:
          type: object
          additionalProperties: true
        revenue:
          type: object
          additionalProperties: true
    HistoricalPrice:
      type: object
      properties:
        symbol: { type: string }
        date: { type: string, format: date }
        price: { type: number }
        currency: { type: string }
    PriceBarSeries:
      type: object
      required: [symbol, timeframe, stale, dates, closes]
      properties:
        symbol: { type: string }
        timeframe: { type: string }
        stale: { type: boolean }
        currency: { type: string, nullable: true }
        dates:
          type: array
          items: { type: string, format: date }
        closes:
          type: array
          items: { type: number }
    InvestorRelationEvent:
      type: object
