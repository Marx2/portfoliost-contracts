          type: string
          nullable: true
          description: ISO 4217; defaults to the transaction currency when omitted.
        feeRateSource:
          type: string
          nullable: true
          enum: [automatic, manual]
        feeExchangeRate:
          type: number
          nullable: true
          description: Fee-currency -> transaction/wallet-currency rate for settlement.
